appId: com.rally.app
name: Schedule a match end-to-end
---
- launchApp

# Should already be signed in — land on Hub
- assertVisible: "Players nearby"

# Tap the first player card
- tapOn:
    index: 0
    id: "player-card"

# Slot picker — title is the opponent's name, slots are listed below
- assertVisible: "This week"
- tapOn:
    index: 0
    id: "slot-row"

# Continue to confirm screen
- tapOn: "Continue"

# Confirm screen
- assertVisible: "Confirm match"
- assertVisible: "Send match request"
- tapOn: "Send match request"

# Calendar write permission prompt (iOS system alert — may or may not appear)
- optional:
    - tapOn: "OK"

# Success screen
- assertVisible: "Request sent!"
- tapOn: "Back to Hub"

# Back on Hub
- assertVisible: "Players nearby"
